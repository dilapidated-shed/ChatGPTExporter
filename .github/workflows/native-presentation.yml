name: Read-only native archive presentation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-presentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ASAN_OPTIONS: detect_leaks=0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/ai-ci
          ref: 851cd4a40da4f8311bd22af9ce6b4a57be2c2c65
          path: independent-presentation
          persist-credentials: false
      - name: Qualified native ICK frontend
        id: ick
        uses: isomorphisms/ai-ci/ick-host@2383379394a7af5a8808abbe2d7b159a55328a83
      - name: Pinned Grease runtime
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: dilapidated-shed/grease
          run-id: 41253994123
          artifact-ids: 13062637698
          merge-multiple: true
          github-token: ${{ github.token }}
          path: grease
      - run: chmod +x grease/_bin/cxx-asan/ysh
      - run: echo '7e31cd05b7a9d8fb2a4a9e003a7f3fcb0159138506d17f0fb28da8cbe22aa85c  grease/_bin/cxx-asan/ysh' | sha256sum -c -
      - run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Declared host TLS fixture dependencies
        run: sudo apt-get update
      - run: sudo apt-get install --no-install-recommends -y libssl-dev libcurl4-openssl-dev pkg-config ripgrep
      - name: Produce the existing synthetic offline capture through ICK
        run: >
          make -C native check-capture CC="${{ steps.ick.outputs.compiler }}"
          CFLAGS='-fno-link-libatomic -std=c11 -O2 -Wall -Wextra -Werror -pedantic'
      - name: Independently check actual archive projection and refusing mutations
        run: >
          grease/_bin/cxx-asan/ysh examples/autogenerated/read-only-presentation/verify.grease
          "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/independent-presentation"
          "${{ steps.ick.outputs.compiler }}" "$RUNNER_TEMP/native-presentation"
      - name: Preserve source-bound host evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-presentation-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          path: ${{ runner.temp }}/native-presentation
