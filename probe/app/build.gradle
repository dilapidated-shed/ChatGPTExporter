plugins {
    id 'com.android.application'
}

android {
    namespace 'org.isomorphisms.chatgptprobe'
    compileSdk 34

    defaultConfig {
        applicationId 'org.isomorphisms.chatgptprobe'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
