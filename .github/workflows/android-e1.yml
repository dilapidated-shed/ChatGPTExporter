name: E1 direct DEX native WebView fixture
on:
  pull_request:
    paths:
      - android/**
      - native/**
      - examples/autogenerated/android-export-shell/**
      - .github/workflows/android-e1.yml
permissions:
  contents: read
  actions: read
jobs:
  direct-dex:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/android-NDK
          ref: b2ee19121aa3fa1112cd8338b7b6a7baca237b5f
          path: callback-producer
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/Idric
          ref: ff4d852862a3942592f8ade9afde8d409d9803be
          path: compiler
          persist-credentials: false
      - uses: actions/cache/restore@v4
        id: compiler-cache
        with:
          path: |
            compiler/_
            ~/.idris2
          key: exporter-idric-ff4d852862-ubuntu24-v1
      - name: Bootstrap the pinned Idric producer on the build host
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        run: ./compiler/_/edric bootstrap
      - run: make -C compiler/_/support/chez install IDRIS2_VERSION=0.8.0
      - run: make -C compiler/_ install-bootstrap-libs IDRIS2=${{ github.workspace }}/compiler/_/build/exec/idris2
      - uses: actions/cache/save@v4
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        with:
          path: |
            compiler/_
            ~/.idris2
          key: exporter-idric-ff4d852862-ubuntu24-v1
      - name: Emit application callback metadata twice with retained direct DEX encoder
        env:
          PATH: ${{ github.workspace }}/compiler/_/.tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: make -C android dex ANDROID_NDK=${{ github.workspace }}/callback-producer IDRIC=${{ github.workspace }}/compiler/_/build/exec/idris2
      - name: Independently inspect all emitted DEX headers
        run: make -C android dex-check ANDROID_NDK=${{ github.workspace }}/callback-producer
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: direct-exporter-shells
          path: android/build/direct-dex/
  native-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: ''
      - run: sdkmanager "ndk;29.0.14206865"
      - name: Cross-compile existing portable capture libraries independently of DEX
        run: make -C android native-capture CC_ARM64=$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang CC_X86_64=$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android26-clang
  webview:
    needs: direct-dex
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ASAN_OPTIONS: detect_leaks=0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: direct-exporter-shells
          path: direct-dex
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: dilapidated-shed/grease
          run-id: 41253994123
          artifact-ids: 13062637698
          merge-multiple: true
          github-token: ${{ github.token }}
          path: grease-runtime
      - name: Permit the pinned ASAN Grease runtime on the ephemeral host
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Verify pinned native Grease
        run: make -C android verify-grease GREASE=${{ github.workspace }}/grease-runtime/_bin/cxx-asan/ysh
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphismes/wegert
          ref: dfa3751f0282cdf6a2083c97063b0e8e996d0d92
          path: fixture-signer
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: ''
      - name: Install build-host Android inputs
        run: sdkmanager "platforms;android-34" "build-tools;36.0.0" "ndk;29.0.14206865"
      - name: Independent archive UI observer, separate from product source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/ai-ci
          ref: 70d9d1ecd1194757c41e47ac8539b85e1a5d2156
          path: independent-archive-ui
          persist-credentials: false
      - name: Declared observer text verifier
        run: sudo apt-get install --no-install-recommends -y ripgrep
      - id: ick-host
        uses: isomorphisms/ai-ci/ick-host@2383379394a7af5a8808abbe2d7b159a55328a83
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/android-NDK
          ref: b2ee19121aa3fa1112cd8338b7b6a7baca237b5f
          path: presentation-components
          persist-credentials: false
      - id: ick-arm64
        uses: isomorphisms/ai-ci/ick-android@2383379394a7af5a8808abbe2d7b159a55328a83
        with:
          abi: arm64-v8a
          ndk: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
      - id: ick-x86
        uses: isomorphisms/ai-ci/ick-android@2383379394a7af5a8808abbe2d7b159a55328a83
        with:
          abi: x86_64
          ndk: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
      - name: Declare separate ICK source and NDK platform stages
        run: >
          echo 'ICK_ARM64=${{ steps.ick-arm64.outputs.compiler }}' >> "$GITHUB_ENV"
      - run: echo 'ICK_X86_64=${{ steps.ick-x86.outputs.compiler }}' >> "$GITHUB_ENV"
      - run: echo "NDK=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - run: echo "GREASE=$GITHUB_WORKSPACE/grease-runtime/_bin/cxx-asan/ysh" >> "$GITHUB_ENV"
      - run: echo "PRESENTATION_REPOSITORY=$GITHUB_WORKSPACE/presentation-components" >> "$GITHUB_ENV"
      - run: echo 'CC=${{ steps.ick-host.outputs.compiler }}' >> "$GITHUB_ENV"
      - run: echo 'CFLAGS=-fno-link-libatomic -std=c11 -O2 -Wall -Wextra -Werror -pedantic' >> "$GITHUB_ENV"
      - name: Build candidate WebView APKs and portable capture libraries without tablet claims
        run: make -C android build fixture validate native-capture DEX_DIR=${{ github.workspace }}/direct-dex DEX_SOURCE=${{ github.event.pull_request.head.sha || github.sha }} CC_ARM64=$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang CC_X86_64=$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android26-clang BUILD_TOOLS=$ANDROID_HOME/build-tools/36.0.0 ANDROID_JAR=$ANDROID_HOME/platforms/android-34/android.jar KEYSTORE=${{ github.workspace }}/fixture-signer/_/build/app/wegert-debug.keystore CERT_SHA256=de9b1d47c5a65e6d46a204b79dd9ee566b9d3c9832ba81ebc4213d3392e92ff9
      - name: Prepare ephemeral emulator hardware access
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: ${{ github.workspace }}/grease-runtime/_bin/cxx-asan/ysh android/prepare-emulator.grease
      - name: Sign review candidate with the unchanged development identity
        run: make -C android development-candidate DEX_DIR=${{ github.workspace }}/direct-dex DEX_SOURCE=${{ github.event.pull_request.head.sha || github.sha }} BUILD_TOOLS=$ANDROID_HOME/build-tools/36.0.0 ANDROID_JAR=$ANDROID_HOME/platforms/android-34/android.jar KEYSTORE=${{ github.workspace }}/fixture-signer/_/build/app/wegert-debug.keystore
      - name: Rebuild native payload, package and development signature byte-for-byte
        run: make -C android reproduce-candidate DEX_DIR=${{ github.workspace }}/direct-dex DEX_SOURCE=${{ github.event.pull_request.head.sha || github.sha }} CC_ARM64=$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang BUILD_TOOLS=$ANDROID_HOME/build-tools/36.0.0 ANDROID_JAR=$ANDROID_HOME/platforms/android-34/android.jar KEYSTORE=${{ github.workspace }}/fixture-signer/_/build/app/wegert-debug.keystore
      - name: Package actual production x86 native code for offline fixture namespace update
        run: make -C android production-reader DEX_DIR=${{ github.workspace }}/direct-dex DEX_SOURCE=${{ github.event.pull_request.head.sha || github.sha }} CC_X86_64=$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android26-clang BUILD_TOOLS=$ANDROID_HOME/build-tools/36.0.0 ANDROID_JAR=$ANDROID_HOME/platforms/android-34/android.jar KEYSTORE=${{ github.workspace }}/fixture-signer/_/build/app/wegert-debug.keystore
      - name: Pinned foreign test assembler, never a product DEX producer
        run: curl --fail --location https://github.com/baksmali/smali/releases/download/3.0.10/smali-3.0.10-fat-release.jar -o smali.jar
      - run: echo '32fa0e88a6c397b3922201adf5f3e534fbaed5a663c71d0c558c3ddce0af844a  smali.jar' | sha256sum -c -
      - name: Exercise actual Android WebMessagePort callbacks
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          ASAN_OPTIONS: detect_leaks=0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          disable-linux-hw-accel: false
          script: |
            ${{ github.workspace }}/grease-runtime/_bin/cxx-asan/ysh ${{ github.workspace }}/android/qualify.grease $ANDROID_HOME/platform-tools/adb ${{ github.workspace }}/android/build/e1-synthetic.apk ${{ github.workspace }}/android/build/emulator
            ${{ github.workspace }}/grease-runtime/_bin/cxx-asan/ysh ${{ github.workspace }}/independent-archive-ui/examples/autogenerated/native-presentation/observe-archive-ui.grease ${{ github.workspace }}/independent-archive-ui $ANDROID_HOME $ANDROID_HOME/platform-tools/adb ${{ github.workspace }}/android/build/production-reader.apk ${{ github.workspace }}/fixture-signer/_/build/app/wegert-debug.keystore ${{ github.workspace }}/smali.jar ${{ github.workspace }}/android/build/independent-reader 34
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: e1-android-evidence
          path: android/build/
