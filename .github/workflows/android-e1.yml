name: E1 direct DEX native WebView fixture
on:
  pull_request:
    paths:
      - android/**
      - native/**
      - .github/workflows/android-e1.yml
permissions:
  contents: read
  actions: read
jobs:
  native-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: ''
      - run: sdkmanager "ndk;29.0.14206865"
      - name: Compile both native payloads independently of DEX qualification
        run: make -C android native CC_ARM64=$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang CC_X86_64=$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android26-clang
  webview:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: isomorphisms/android-NDK
          run-id: 39094757573
          github-token: ${{ github.token }}
          name: direct-webview-shells
          path: direct-dex
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: dilapidated-shed/grease
          run-id: 38206821183
          github-token: ${{ github.token }}
          name: grease-alias-diagnostics-8bad10b21e0fe7fc93e851d705dc9b63dbf9d8fd
          path: grease-runtime
      - name: Verify pinned native Grease
        run: make -C android verify-grease GREASE=${{ github.workspace }}/grease-runtime/_bin/cxx-asan/ysh
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphismes/wegert
          ref: dfa3751f0282cdf6a2083c97063b0e8e996d0d92
          path: fixture-signer
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: ''
      - name: Install build-host Android inputs
        run: sdkmanager "platforms;android-34" "build-tools;36.0.0" "ndk;29.0.14206865"
      - name: Build arm64 source candidate and separate x86 synthetic fixture
        run: make -C android build fixture validate DEX_DIR=${{ github.workspace }}/direct-dex DEX_SOURCE=950fef409148e91fc3ed59b0fbf64368f1ad0438 CC_ARM64=$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang CC_X86_64=$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android26-clang BUILD_TOOLS=$ANDROID_HOME/build-tools/36.0.0 ANDROID_JAR=$ANDROID_HOME/platforms/android-34/android.jar KEYSTORE=${{ github.workspace }}/fixture-signer/_/build/app/wegert-debug.keystore CERT_SHA256=de9b1d47c5a65e6d46a204b79dd9ee566b9d3c9832ba81ebc4213d3392e92ff9
      - name: Prepare ephemeral emulator hardware access
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: ${{ github.workspace }}/grease-runtime/_bin/cxx-asan/ysh android/prepare-emulator.grease
      - name: Exercise actual Android WebMessagePort callbacks
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          ASAN_OPTIONS: detect_leaks=0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          disable-linux-hw-accel: false
          script: ${{ github.workspace }}/grease-runtime/_bin/cxx-asan/ysh ${{ github.workspace }}/android/qualify.grease $ANDROID_HOME/platform-tools/adb ${{ github.workspace }}/android/build/e1-synthetic.apk ${{ github.workspace }}/android/build/emulator
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: e1-android-evidence
          path: android/build/

  c67-trial:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 39095279328
          github-token: ${{ github.token }}
          name: e1-android-evidence
          path: android/build
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphismes/wegert
          ref: dfa3751f0282cdf6a2083c97063b0e8e996d0d92
          path: fixture-signer
          persist-credentials: false
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: ''
      - run: sdkmanager "build-tools;36.0.0"
      - name: Sign verified E1 ARM64 bytes for C67 trial
        run: make -C android c67-trial BUILD_TOOLS=$ANDROID_HOME/build-tools/36.0.0 KEYSTORE=${{ github.workspace }}/fixture-signer/_/build/app/wegert-debug.keystore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chatgpt-exporter-c67-e1
          path: |
            android/build/chatgpt-exporter-c67-e1.apk
            android/build/c67.sha256
            android/build/c67-signature.txt
            android/build/c67-manifest.txt
            android/build/source-commit.txt
