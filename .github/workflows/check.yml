name: check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Credential-free native web contract
        run: make -C native check
      - name: Native bounded WebView bridge contract
        run: make -C native check-webview
      - name: Host-only TLS fixture dependencies
        run: sudo apt-get install -y libcurl4-openssl-dev libssl-dev openssl
      - name: Native private content-addressed storage
        run: make -C native check-store
      - name: Native HTTPS read-only transport, synthetic TLS fixture
        run: make -C native check-https
